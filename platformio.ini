[platformio]
default_envs = c3_native, c3_uart

[env]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
extra_scripts = post:scripts/package_firmware.py
build_flags = -DCORE_DEBUG_LEVEL=0

[env:c3_native]
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_uart]
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
