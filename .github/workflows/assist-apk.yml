name: Build AssistStructure apps
on:
  push:
    branches: [main]
    paths: ['android-assist/**', 'desktop-monitor/**', '.github/workflows/assist-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android-assist
      - uses: actions/upload-artifact@v4
        with:
          name: assist-structure-lab-debug
          path: android-assist/app/build/outputs/apk/debug/app-debug.apk
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop-monitor/requirements.txt pyinstaller==6.22.2
      - run: python -m unittest discover -s desktop-monitor/tests -v
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Assist-LAN-Monitor monitor.py
        working-directory: desktop-monitor
      - uses: actions/upload-artifact@v4
        with:
          name: assist-lan-monitor-windows
          path: desktop-monitor/dist/Assist-LAN-Monitor.exe
