name: Build AssistStructure test APK
on:
  push:
    branches: [main]
    paths: ['android-assist/**', '.github/workflows/assist-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android-assist
      - uses: actions/upload-artifact@v4
        with:
          name: assist-structure-lab-debug
          path: android-assist/app/build/outputs/apk/debug/app-debug.apk
