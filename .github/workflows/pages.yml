name: Build firmware and publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install platformio==6.1.19
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-c3-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Build both USB console variants and merged flash images
        run: pio run
      - name: Check web scripts and firmware manifests
        run: |
          node --check docs/app.js
          node --check docs/target.js
          python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-ble-touch-firmware
          path: docs/firmware/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
