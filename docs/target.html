<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b29"><title>C3 Touch Lab · 手机测试靶页</title><link rel="stylesheet" href="style.css"><style>
body{background:#101b29;color:#d9e8ee;overscroll-behavior:none}.target-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.target-header a{color:#69ddc3;font-size:13px}.target-header strong{font-size:14px}.target-main{padding:0 16px 20px;max-width:1000px}.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:3px 0 14px}.readout{border:1px solid #304356;background:#172739;border-radius:10px;padding:10px 12px}.readout span{display:block;font-size:10px;color:#8ba7bb}.readout strong{font:20px/1.6 ui-monospace,monospace}.readout:first-child strong{color:#65e2c4}#surface{height:60dvh;min-height:280px;position:relative;border:1px solid #3b6070;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;background:linear-gradient(#304a5e60 1px,transparent 1px),linear-gradient(90deg,#304a5e60 1px,transparent 1px);background-size:10% 10%;background-color:#142536}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.target-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#7097aa;pointer-events:none;width:90%}.target-guide b{font-size:35px;font-weight:300;display:block}.target-guide p{font-size:12px;margin:6px 0}.target-footer{display:flex;gap:10px;align-items:center;margin:14px 0}.target-footer button{background:#22394b;color:#e1f1f5;border-color:#3b5263;padding:8px 12px;font-size:12px}.target-main .hint{color:#90a8b9}#event-log{height:130px;background:#0b1520;border:1px solid #26394b;font-size:10px}.coordinates-list{min-height:25px;font:11px/1.7 ui-monospace,monospace;color:#83dfc7;overflow-wrap:anywhere}body.fullscreen .target-header{padding:8px 20px}body.fullscreen #surface{height:70dvh}.type-touch{color:#65e2c4}.type-mouse{color:#ffd38b}
</style><script type="module" src="target.js"></script></head><body>
<header class="target-header"><strong>C3 Touch Lab / 手机靶页</strong><a href="./">控制台 ↗</a></header>
<main class="target-main"><div class="readouts"><div class="readout"><span>最近输入类型</span><strong id="input-type">—</strong></div><div class="readout"><span>当前 / 最大触点</span><strong id="contacts">0 / 0</strong></div><div class="readout"><span>触摸开始次数</span><strong id="touch-count">0</strong></div></div>
<div id="surface"><canvas id="traces"></canvas><div class="target-guide"><b>＋</b><p>从电脑发送中心点击、滑动或双指手势</p><p>touch = 触摸　mouse = 鼠标　pen = 触控笔</p></div></div>
<div class="coordinates-list" id="contact-info">等待输入…</div><div class="target-footer"><button id="fullscreen">全屏测试</button><button id="clear">清空轨迹与计数</button></div><pre id="event-log">在手机蓝牙设置中配对 C3-Touch-xxxx，再从电脑控制台发送手势。</pre>
<p class="hint">这个页面显示浏览器 Pointer Events 的实际类型；手指直接触摸手机也会显示 touch。为了区分 C3 的结果，请把手离开屏幕后从电脑发指令。它不读取 Android 原生 SOURCE_TOUCHSCREEN，也不证明输入来自内置触摸屏。</p></main></body></html>
